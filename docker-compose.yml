version: '3.8'

services:
  # ==========================================
  # 1. NestJS Backend API & WebSocket Gateway
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-restaurant-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres.avsrdsjxgxutdedapwmx:Sharktank321123@aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres
      - DIRECT_URL=postgresql://postgres.avsrdsjxgxutdedapwmx:Sharktank321123@aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres
      - JWT_SECRET=smart_restaurant_jwt_super_secret_key_2026
      - JWT_EXPIRES_IN=7d
      - TABLE_TOKEN_SECRET=smart_restaurant_table_hmac_token_secret_key_2026
      - CORS_ORIGIN=*
    command: >
      sh -c "npx prisma db push --skip-generate &&
             npm run start:prod"

  # ==========================================
  # 2. Next.js Frontend (PWA Client, POS, KDS, Admin)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-restaurant-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
    depends_on:
      - backend
